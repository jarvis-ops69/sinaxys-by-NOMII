<!-- @dsCard height=288 -->
<!doctype html><html><head><style>
  html,body{margin:0;background:var(--background)}
  .cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--background);font-family:var(--font-sans)}
  svg{position:absolute;left:0;top:0}
  .b-primary{fill:var(--primary)} .b-lime{fill:var(--brand-lime)} .b-cyan{fill:var(--brand-cyan)} .b-glow{fill:var(--primary-glow)}
  .p-deep{fill:var(--primary-deep)}
  .r-3xl{rx:var(--radius-3xl);ry:var(--radius-3xl)}
  .name{position:absolute;left:40px;bottom:70px;margin:0;max-width:440px;font:700 100px/.92 var(--font-sans);letter-spacing:-.025em;color:var(--foreground)}
  .tag{position:absolute;left:40px;bottom:36px;margin:0;max-width:440px;font:400 14px/20px var(--font-sans);color:var(--muted-foreground)}
</style></head><body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: primary 296×288+bleed, brand-lime 184×152, brand-cyan 112×124, primary-glow 72×124 (sides from space-4/space-6 multiples), corners radius-3xl
arrangement: one tall violet slab with satellites, bleeding off the top and right edges
pattern: three pills offset like the strokes of the Sinaxys "S" symbol — the brand's mark is built from rounded half-bands, and the site rounds everything (radius-xl to radius-3xl)
steps & radii: pitch 64 (space-16), gap 16 (space-4), pill height 48 rx 24 (half the short side), blocks radius-3xl
-->
  <rect class="b-primary r-3xl" x="496" y="-24" width="296" height="336"/>
  <rect class="b-lime r-3xl" x="808" y="-24" width="184" height="176"/>
  <rect class="b-cyan r-3xl" x="808" y="168" width="112" height="144"/>
  <rect class="b-glow r-3xl" x="936" y="168" width="72" height="144"/>
  <rect class="p-deep" x="560" y="56" width="200" height="48" rx="24"/>
  <rect class="p-deep" x="528" y="120" width="232" height="48" rx="24"/>
  <rect class="p-deep" x="528" y="184" width="200" height="48" rx="24"/>
</svg>
<h1 class="name">Sinaxys</h1>
<p class="tag">Organização para a instituição. Transparência para quem atende.</p>
</div>
</body></html>
